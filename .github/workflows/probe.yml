name: Probe

# Temporary diagnostic. Every job in ci.yml uses actions/checkout and
# actions/setup-python, so a policy that blocks marketplace actions fails all
# of them identically at startup -- no runner, no logs -- which looks the same
# as having no runner at all. These three jobs tell those cases apart.
#
# Read the result like this:
#   all three fail            -> runner assignment, nothing to do with actions
#   bare passes, others fail  -> marketplace actions are blocked by policy
#   all three pass            -> the problem is specific to ci.yml
#
# Delete this file once the cause is known.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  bare:
    name: 1. No actions at all
    runs-on: ubuntu-latest
    steps:
      - name: Report the runner
        run: |
          echo "os=$RUNNER_OS arch=$RUNNER_ARCH name=$RUNNER_NAME"
          echo "python: $(python3 --version 2>&1)"
          echo "git: $(git --version)"
          echo "A runner was assigned and a step ran."

  manual-checkout:
    name: 2. Checkout by hand, still no actions
    runs-on: ubuntu-latest
    steps:
      - name: Clone with git instead of actions/checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
              fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          echo "checked out $GITHUB_SHA"
          ls
      - name: Run the suite on the preinstalled Python
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pytest ruff
          python3 -m pytest -q
          python3 -m ruff check src tests tools
          python3 tools/build_single_file.py --check

  with-marketplace-action:
    name: 3. Using actions/checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "actions/checkout is permitted"
